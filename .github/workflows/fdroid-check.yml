name: F-Droid recipe check
on:
  push:
    branches: [fdroid-recipe-check]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  fdroid:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build in F-Droid's buildserver image
        run: |
          report_failure() {
            details=$(tail -n 30 "${RUNNER_TEMP}/fdroid-build.log")
            details=${details//%/%25}
            echo "::error::${details//$'\n'/%0A}"
          }
          trap report_failure ERR
          input="$RUNNER_TEMP/fdroid-input"
          output="$RUNNER_TEMP/fdroid-output"
          mkdir -p "$input" "$output"
          cp fdroid-check/metadata/*.yml "$input/"
          git clone --bare --no-hardlinks . "$input/fibbies.git"
          image=registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie@sha256:1ea8bef1820bff06c2974e31b4fc4c79c364cd24231b86e71fa4b926797e0dac
          docker pull "$image" > "${RUNNER_TEMP}/fdroid-build.log" 2>&1
          docker run --rm --user root --entrypoint /bin/bash \
            -v "$input:/input:ro" \
            -v "$output:/output" \
            "$image" -exc '
              git clone --depth 1 https://github.com/f-droid/fdroidserver.git /opt/fdroidserver-source
              mkdir -p /home/vagrant/test-build/metadata
              mkdir -p /home/vagrant/test-build/config
              curl --fail --location --output /home/vagrant/test-build/config/categories.yml https://raw.githubusercontent.com/f-droid/fdroiddata/6e52e1ad56721f12c49f48d936e9da05ef740d91/config/categories.yml
              sed -i "/^[[:space:]]*icon:/d" /home/vagrant/test-build/config/categories.yml
              cp /input/*.yml /home/vagrant/test-build/metadata/
              chown -R vagrant /home/vagrant/test-build
              cd /home/vagrant/test-build
              export ANDROID_HOME=/opt/android-sdk
              export ANDROID_SDK_ROOT=/opt/android-sdk
              export PATH=/opt/fdroidserver-source:/usr/local/bin:/usr/bin:/bin:$PATH
              export PYTHONPATH=/opt/fdroidserver-source
              unset CI
              sudo --preserve-env --user vagrant env HOME=/home/vagrant PATH="$PATH" PYTHONPATH="$PYTHONPATH" fdroid readmeta
              sudo --preserve-env --user vagrant env HOME=/home/vagrant PATH="$PATH" PYTHONPATH="$PYTHONPATH" fdroid lint io.github.slovenec88.fibbies
              sed -i "/^Binaries:/d" metadata/io.github.slovenec88.fibbies.yml
              sudo --set-home --user vagrant git config --global --add safe.directory /input/fibbies.git
              sudo --set-home --user vagrant git config --global url.file:///input/fibbies.git.insteadOf https://github.com/slovenec88/fibbies.git
              sdkmanager "platforms;android-36" "build-tools;35.0.0"
              sudo --preserve-env --user vagrant env HOME=/home/vagrant PATH="$PATH" PYTHONPATH="$PYTHONPATH" fdroid build --verbose --test --on-server --no-tarball io.github.slovenec88.fibbies:14
              env HOME=/home/vagrant fdroid scanner --verbose --exit-code tmp/io.github.slovenec88.fibbies_14.apk
              cp tmp/io.github.slovenec88.fibbies_14.apk /output/Fibbies-v1.3.4-unsigned.apk
            ' 2>&1 | tee "${RUNNER_TEMP}/fdroid-build.log"
          echo "::notice::F-Droid unsigned SHA-256 $(sha256sum "$output/Fibbies-v1.3.4-unsigned.apk" | cut -d ' ' -f 1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fibbies-1.3.4-fdroid-unsigned
          path: ${{ runner.temp }}/fdroid-output/Fibbies-v1.3.4-unsigned.apk
          if-no-files-found: error
          retention-days: 3
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rebuild the APK with the recipe commands
        run: |
          trap 'tail -n 10 "$RUNNER_TEMP/linux-build.log" | while IFS= read -r line; do echo "::error::${line//%/%25}"; done' ERR
          {
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$JAVA_HOME/bin:$PATH"
            curl --fail --location --output "$RUNNER_TEMP/node.tar.xz" https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
            echo "cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8  $RUNNER_TEMP/node.tar.xz" | sha256sum -c -
            mkdir "$RUNNER_TEMP/node"
            tar -xJf "$RUNNER_TEMP/node.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/node"
            export PATH="$RUNNER_TEMP/node/bin:$PATH"
            npm ci --ignore-scripts
            npm test
            CI=1 npm run sync
            bash android/gradlew -p android --no-daemon :app:assembleRelease
            test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
          } > "$RUNNER_TEMP/linux-build.log" 2>&1
          cat "$RUNNER_TEMP/linux-build.log"
          echo "::notice::Linux unsigned SHA-256 $(sha256sum android/app/build/outputs/apk/release/app-release-unsigned.apk | cut -d ' ' -f 1)"
